version: 2
updates:
  # The repository has no npm dependencies; only workflow actions need updates.
  # Dependabot keeps the full-SHA pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # init, analyze, and upload-sarif must move together; one PR per release.
      codeql-action:
        patterns:
          - github/codeql-action*
      # Remaining action updates arrive as one weekly PR.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - github/codeql-action*
