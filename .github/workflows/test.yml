name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      # Offline search contract only. Production search validation is
      # release-triggered by design and must not run in ordinary PR CI.
      - run: node scripts/check-search.mjs
