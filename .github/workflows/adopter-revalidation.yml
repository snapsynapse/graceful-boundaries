name: Adopter revalidation

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: Siteline
            url: https://siteline.to/
            min_level: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run passive conformance check
        id: check
        continue-on-error: true
        env:
          ADOPTER_URL: ${{ matrix.url }}
          MIN_LEVEL: ${{ matrix.min_level }}
        run: node evals/check.js "$ADOPTER_URL" --json --min-level "$MIN_LEVEL" > adopter-result.json 2> adopter-check.log
      - name: Retain checker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopter-${{ matrix.service }}-${{ github.run_id }}
          path: |
            adopter-result.json
            adopter-check.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce result
        if: steps.check.outcome != 'success'
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          echo "$SERVICE_NAME no longer meets its passively verifiable registry level."
          exit 1
